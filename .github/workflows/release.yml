name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Install dependencies
        run: bun install
      - name: Build + Package
        run: bun run build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/gwsh-code-setup-*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Install dependencies
        run: bun install
      - name: Build + Package
        run: bun run build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/installer/gwsh-code-*.pkg
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Install dependencies
        run: bun install
      - name: Build + Package
        run: bun run build
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: dist/installer/gwsh-code-*-linux-x64.tar.gz
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: linux-archive
          path: artifacts/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
