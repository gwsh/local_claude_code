name: Check Upstream Bug Fixes

on:
  schedule:
    # Run daily at 8:00 UTC (4:00 PM Beijing)
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream Claude Code
        run: |
          git remote add upstream-code https://github.com/anthropics/claude-code.git || true
          git fetch upstream-code 2>/dev/null || echo "upstream-code fetch failed"

      - name: Check for bug-fix commits and create issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SINCE="2 days ago"
          REPO="anthropics/claude-code"
          BRANCH="upstream-code/main"

          if ! git rev-parse --verify "${BRANCH}" >/dev/null 2>&1; then
            echo "${REPO}: branch not found, skipping"
            exit 0
          fi

          # Filter for bug-fix, security, crash-related commits only
          FIXES=$(git log --oneline "${BRANCH}" --since="${SINCE}" \
            --grep="fix\|bug\|revert\|crash\|OOM\|memory\|leak\|security\|vulnerability\|CVE" -i 2>/dev/null || echo "")

          ALL_COMMITS=$(git log --oneline "${BRANCH}" --since="${SINCE}" 2>/dev/null || echo "")
          FIX_COUNT=$(echo "$FIXES" | grep -c . || echo 0)
          ALL_COUNT=$(echo "$ALL_COMMITS" | grep -c . || echo 0)

          if [ "$FIX_COUNT" -eq 0 ]; then
            echo "No bug-fix commits since ${SINCE}"
            exit 0
          fi

          echo "Found ${FIX_COUNT} bug-fix commit(s) out of ${ALL_COUNT} total"

          BODY="## Upstream bug-fix commits detected: [${REPO}](https://github.com/${REPO})

          **${FIX_COUNT} bug-fix commit(s)** since ${SINCE} (${ALL_COUNT} total commits):

          \`\`\`
          ${FIXES}
          \`\`\`

          **Compare:** https://github.com/${REPO}/commits/main

          > Automated check via \`.github/workflows/check-upstream.yml\`"

          # Check if a similar issue already exists
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --search "Upstream bug-fix: ${REPO}" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            echo "Issue #${EXISTING} already open, adding comment..."
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --body "Still behind ${REPO}. Latest bug-fix commits:\n\n\`\`\`\n${FIXES}\n\`\`\`"
          else
            TITLE="Upstream bug-fix: ${REPO} — ${FIX_COUNT} fix(es)"
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body "$BODY" \
              --label "upstream"
            echo "Issue created."
          fi
